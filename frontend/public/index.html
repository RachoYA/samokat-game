<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#00D563" />
    <meta name="description" content="Микрорайон 3D - Градостроительный пазл от Самокат" />
    
    <!-- Mobile App Capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Микрорайон 3D" />
    
    <!-- Prevent text size adjustment on mobile -->
    <meta name="format-detection" content="telephone=no" />
    
    <title>🛴 Микрорайон 3D</title>
    
    <style>
        /* Prevent pull-to-refresh on mobile */
        body {
            overscroll-behavior-y: contain;
            touch-action: pan-x pan-y;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Loading indicator */
        #root:empty::after {
            content: "Загрузка...";
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 24px;
            color: #00D563;
        }
    </style>
</head>
<body>
    <noscript>Вам необходимо включить JavaScript для запуска этой игры.</noscript>
    <div id="root"></div>
</body>
</html>
